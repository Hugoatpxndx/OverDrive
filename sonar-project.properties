# ============================================================
# Configuración base de SonarQube para OverDrive
# ============================================================

# Identificación del proyecto en SonarQube
sonar.projectKey=overdrive
sonar.projectName=OverDrive
sonar.projectVersion=1.0.0

# ============================================================
# Carpetas a analizar
# ============================================================
sonar.sources=backend,frontend/src

# ============================================================
# Carpetas a excluir (no analizar)
# ============================================================
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/database/**,**/*.sql

# ============================================================
# Cobertura de pruebas (integración con Jest + Istanbul)
# ============================================================
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# El frontend no tiene pruebas unitarias (se valida con el build),
# por lo que se excluye del cálculo de cobertura para no diluirla.
sonar.coverage.exclusions=frontend/**,backend/tests/**,backend/jest.config.js

# ============================================================
# Configuración de análisis de JavaScript/TypeScript
# ============================================================
sonar.javascript.node.maxspace=4096

# ============================================================
# Encoding y fuentes
# ============================================================
sonar.sourceEncoding=UTF-8
