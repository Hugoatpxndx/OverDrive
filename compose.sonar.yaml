# ============================================================
# OverDrive · SonarQube local (para la evidencia de calidad)
#
# Uso:
#   docker compose -f compose.sonar.yaml up -d
#   # luego ejecuta el script:  ./scripts/analisis-calidad.sh
#   # interfaz: http://localhost:9000
#
# Alternativa recomendada: usa el script todo-en-uno que ya
# levanta el servidor, genera el token y ejecuta el escáner:
#   ./scripts/analisis-calidad.sh
# ============================================================

services:
  sonarqube:
    image: sonarqube:community
    container_name: overdrive-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions

volumes:
  sonar_data:
  sonar_logs:
  sonar_extensions:
