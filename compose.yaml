# ============================================================
# OverDrive - Orquestación con Docker Compose
# Levanta la pila completa (MaríaDB + Backend + Frontend):
#   docker compose up -d --build
#   docker compose down        # detener
#   docker compose logs -f     # ver logs
#
# Puertos expuestos:
#   - Frontend: http://localhost:5173
#   - Backend:  http://localhost:4000  (incl. callback Spotify 127.0.0.1:4000)
#   - MaríaDB:  127.0.0.1:3307 (solo inspección; no obligatorio)
#
# NOTA: usa una base de datos LIMPIA (volumen dedicado). Tus datos actuales
# de la BD local no se usarán. El admin inicial se crea automáticamente:
#   admin@overdrive.app / Admin123!
# ============================================================

services:
  db:
    image: mariadb:11
    container_name: overdrive-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "2010"
      MARIADB_DATABASE: overdrive
      MARIADB_USER: overdrive_user
      MARIADB_PASSWORD: "2010"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # En el primer arranque, MaríaDB ejecuta los scripts en orden alfabético.
      # 01 = esquema (crea tablas + admin), 02 = migración de Spotify.
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/migrations/001_spotify_tokens.sql:/docker-entrypoint-initdb.d/02-spotify-tokens.sql:ro
      - ./backend/database/migrations/002_spotify_identity.sql:/docker-entrypoint-initdb.d/03-spotify-identity.sql:ro
    healthcheck:
      # start_period: los fallos durante la primera inicialización de la BD
      # (volumen nuevo) no cuentan como "unhealthy".
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - overdrive-net

  backend:
    build:
      context: ./backend
    container_name: overdrive-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Dentro de la red Docker, la BD se llama "db", no "localhost".
      DB_HOST: db
      DB_PORT: "3306"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - overdrive-net

  frontend:
    build:
      context: ./frontend
    container_name: overdrive-frontend
    restart: unless-stopped
    environment:
      # Target del proxy de Vite: dentro de la red, el backend es "backend".
      VITE_PROXY_TARGET: http://backend:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - overdrive-net

volumes:
  db_data:

networks:
  overdrive-net:
    driver: bridge