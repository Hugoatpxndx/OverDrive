# ============================================================
# OverDrive - Docker Compose para Producción (AWS EC2)
# Frontend: nginx sirve archivos estáticos compilados
# Backend: Express en puerto 4000
# Base de datos: MariaDB en puerto interno
# Puertos expuestos:
#   - Frontend: http://IP_EC2:80
#   - Backend API: http://IP_EC2:4000 (Spotify callback)
# ============================================================

services:
  db:
    image: mariadb:11
    container_name: overdrive-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "2010"
      MARIADB_DATABASE: overdrive
      MARIADB_USER: overdrive_user
      MARIADB_PASSWORD: "2010"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/migrations/001_spotify_tokens.sql:/docker-entrypoint-initdb.d/02-spotify-tokens.sql:ro
      - ./backend/database/migrations/002_spotify_identity.sql:/docker-entrypoint-initdb.d/03-spotify-identity.sql:ro
      - ./backend/database/migrations/003_spotify_sync.sql:/docker-entrypoint-initdb.d/04-spotify-sync.sql:ro
      - ./backend/database/migrations/004_email_verification.sql:/docker-entrypoint-initdb.d/05-email-verification.sql:ro
      - ./backend/database/migrations/005_comment_resend_cancel.sql:/docker-entrypoint-initdb.d/06-comment-resend-cancel.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - overdrive-net

  backend:
    build:
      context: ./backend
    container_name: overdrive-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      NODE_ENV: production
      # URL pública para el callback de Spotify (cambia IP_DE_TU_EC2 por tu IP real)
      SPOTIFY_REDIRECT_URI: http://IP_DE_TU_EC2/api/spotify/callback
      # CORS: permitir el mismo origen (nginx proxy)
      CORS_ORIGIN: http://IP_DE_TU_EC2
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - overdrive-net

  frontend:
    build:
      context: ./frontend
    container_name: overdrive-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - overdrive-net

volumes:
  db_data:

networks:
  overdrive-net:
    driver: bridge
