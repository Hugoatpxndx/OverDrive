# Hosting en AWS - OverDrive

## Arquitectura

```
GitHub Actions (CI/CD)
    → Build Docker images
    → Push a AWS ECR
    → Deploy en EC2 via SSH
    → App corriendo en Docker Compose
```

## Paso 1: Crear cuenta AWS (si no tienes)

1. Ve a https://aws.amazon.com
2. Click "Create an AWS Account"
3. Necesitas tarjeta de crédito (hay Free Tier: 12 meses gratis con t2.micro)

## Paso 2: Crear instancia EC2

1. Ve a **EC2 Dashboard** → **Launch Instance**
2. Configura:
   - **Name**: `overdrive-server`
   - **OS**: Ubuntu 24.04 LTS (Free Tier eligible)
   - **Instance type**: `t2.micro` (Free Tier: 12 meses gratis)
   - **Key pair**: Crea uno nuevo, descarga el `.pem` (guárdalo bien)
   - **Network settings**: 
     - Allow SSH (port 22) from "My IP"
     - Allow HTTP (port 80) from "Anywhere"
     - Allow custom TCP (port 4000) from "Anywhere"
   - **Storage**: 20 GB (Free Tier incluye 30 GB)
3. Click **Launch Instance**

## Paso 3: Conectarte a la instancia

```bash
# Cambia la ruta y la IP
chmod 400 ~/Descargas/overdrive-key.pem
ssh -i ~/Descargas/overdrive-key.pem ubuntu@IP_DE_TU_INSTANCIA
```

## Paso 4: Instalar Docker en EC2

```bash
# Conéctate a tu instancia
ssh -i overdrive-key.pem ubuntu@IP_DE_TU_INSTANCIA

# Actualiza e instala Docker
sudo apt update && sudo apt upgrade -y
sudo apt install -y docker.io docker-compose-v2
sudo usermod -aG docker ubuntu
sudo systemctl enable docker
sudo systemctl start docker

# Sale y vuelve a entrar para que el grupo tome efecto
exit
ssh -i overdrive-key.pem ubuntu@IP_DE_TU_INSTANCIA

# Verifica
docker --version
docker compose version
```

## Paso 5: Configurar GitHub Secrets para CI/CD

Ve a tu repo en GitHub → **Settings** → **Secrets and variables** → **Actions** → **New repository secret**

Agrega estos secrets:

| Secret | Valor |
|--------|-------|
| `EC2_HOST` | La IP pública de tu EC2 (ej: `54.210.xx.xx`) |
| `EC2_SSH_KEY` | El contenido COMPLETO de tu archivo `.pem` (incluyendo `-----BEGIN...` y `-----END...`) |
| `EC2_USERNAME` | `ubuntu` |

## Paso 6: Crear archivo de deploy en el repo

Crea `.github/workflows/deploy-aws.yml`:<tool_call>
<function=write>
<parameter=content># ============================================================
# Deploy automático a AWS EC2 via SSH
# Se ejecuta después de que el CI principal apruebe todo
# ============================================================
name: Deploy a AWS EC2

on:
  workflow_run:
    workflows: ["CI/CD OverDrive"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy a EC2
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copiar archivos al servidor
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            backend/ frontend/ compose.yaml docker-compose.prod.yml \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/overdrive/

      - name: Deploy en el servidor
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'DEPLOY'
            cd /tmp/overdrive
            docker compose -f docker-compose.prod.yml down 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d --build
            echo "Esperando a que la BD esté lista..."
            sleep 15
            docker compose -f docker-compose.prod.yml exec -T db sh -c \
              'mysql -u overdrive_user -p2010 overdrive -e "ALTER TABLE submissions ADD COLUMN IF NOT EXISTS comment VARCHAR(500) NULL AFTER track_name;"' 2>/dev/null || true
            docker compose -f docker-compose.prod.yml exec -T db sh -c \
              'mysql -u overdrive_user -p2010 overdrive -e "ALTER TABLE submissions DROP INDEX IF EXISTS uq_track_playlist;"' 2>/dev/null || true
            docker compose -f docker-compose.prod.yml exec -T db sh -c \
              'mysql -u overdrive_user -p2010 overdrive -e "ALTER TABLE submissions MODIFY COLUMN status ENUM('\''pendiente'\'','\''aprobada'\'','\''rechazada'\'','\''cancelada'\'') NOT NULL DEFAULT '\''pendiente'\'';"' 2>/dev/null || true
            echo "Deploy completado!"
          DEPLOY
