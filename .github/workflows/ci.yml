name: OverDrive CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================
  # Job 1: Lint y Tests del Backend
  # ============================================================
  backend-tests:
    name: Backend Tests (Jest + Coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: |
          for i in 1 2 3 4; do
            npm ci --ignore-scripts && break
            [ $i -eq 4 ] && echo "npm ci falló" && exit 1
            echo "npm ci falló (intento $i); reintentando..."
            sleep 10
          done

      - name: Verificar sintaxis de Node.js
        working-directory: backend
        run: node --check server.js

      - name: Ejecutar pruebas unitarias con cobertura
        working-directory: backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_secret' }}
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: overdrive_test
          CORS_ORIGIN: http://localhost:5173
        run: npm test

      - name: Publicar cobertura como artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 7

      - name: Verificar cobertura mínima (>=80%)
        working-directory: backend
        run: |
          # Jest ya valida los umbrales (>=80% en statements/lines/functions) vía jest.config.js.
          # Adicionalmente, verificamos que el reporte de cobertura fue generado.
          if [ ! -f ./coverage/coverage-final.json ]; then
            echo "::error::No se generó el reporte de cobertura (coverage-final.json)"
            exit 1
          fi
          echo "Reporte de cobertura generado correctamente."
          echo "Cobertura verificada por los umbrales de jest.config.js (>=80%)."

  # ============================================================
  # Job 2: Build del Frontend
  # ============================================================
  frontend-build:
    name: Frontend Build (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: |
          for i in 1 2 3 4; do
            npm ci --ignore-scripts && break
            [ $i -eq 4 ] && echo "npm ci falló" && exit 1
            echo "npm ci falló (intento $i); reintentando..."
            sleep 10
          done

      - name: Construir el frontend
        working-directory: frontend
        run: npm run build

  # ============================================================
  # Job 3: Análisis de Seguridad (dependencias vulnerables)
  # ============================================================
  security-scan:
    name: Seguridad Dependencias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Escaneo de vulnerabilidades en dependencias (backend)
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Escaneo de vulnerabilidades en dependencias (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high || true

  # ============================================================
  # Job 4: Análisis de Calidad (SonarQube)
  # OPCIONAL: solo se ejecuta si se configuran los secrets
  # SONAR_TOKEN y SONAR_HOST_URL en el repositorio de GitHub.
  # Si no están configurados, el job se omite (pipeline en verde).
  # Cómo activarlo:
  #   1. Crea una cuenta en https://sonarcloud.io (o usa tu servidor)
  #   2. Genera un token en su pestaña "My Account > Security"
  #   3. En GitHub: Settings > Secrets and variables > Actions, añade:
  #        SONAR_TOKEN=<token>
  #        SONAR_HOST_URL=https://sonarcloud.io
  #   4. Verifica que sonar.projectKey (sonar-project.properties)
  #      coincida con el proyecto creado en SonarQube.
  # ============================================================
  sonarqube:
    name: Análisis de Calidad SonarQube
    runs-on: ubuntu-latest
    needs: [backend-tests]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v5
        with:
          name: coverage-report
          path: backend/coverage/

      - name: Comprobar si SonarQube está configurado
        id: sonar-config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube no configurado (faltan SONAR_TOKEN/SONAR_HOST_URL). Se omite el análisis."
          fi

      - name: Análisis de SonarQube
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ============================================================
  # Job 5: Despliegue en entorno de prueba (CD)
  # Valida el stack servible (BD + API) y hace un smoke test real:
  # health + login JWT del admin contra la BD + endpoint protegido.
  # El frontend ya se compila y valida en el job frontend-build.
  # Usa el servicio MySQL precargado en el runner + Node nativo para
  # evitar descargas de imágenes (los pulls de Docker Hub suelen
  # fallar por rate limits en los runners).
  # Se ejecuta solo en push a main (despliegue continuo).
  # ============================================================
  deploy:
    name: Despliegue en entorno de prueba
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "2010"
          MYSQL_DATABASE: overdrive
          MYSQL_USER: overdrive_user
          MYSQL_PASSWORD: "2010"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -p2010"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      PORT: 4000
      NODE_ENV: production
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: overdrive_user
      DB_PASSWORD: "2010"
      DB_NAME: overdrive
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_deploy_secret' }}
      CORS_ORIGIN: http://localhost:5173
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || '8H8LrSK8qUhvuY7i6Ghs' }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REDIRECT_URI: http://127.0.0.1:4000/api/spotify/callback

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar Node.js (backend)
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: |
          for i in 1 2 3 4; do
            npm ci --ignore-scripts && break
            [ $i -eq 4 ] && echo "npm ci falló" && exit 1
            echo "npm ci falló (intento $i); reintentando..."
            sleep 10
          done

      - name: Inicializar esquema de la BD
        working-directory: backend
        run: npm run db:init

      - name: Arrancar el backend
        run: |
          cd backend
          setsid nohup node server.js > /tmp/overdrive-backend.log 2>&1 < /dev/null &
          disown

      - name: Esperar a que el backend esté saludable
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health >/dev/null; then
              echo "Backend saludable :)"
              exit 0
            fi
            echo "Esperando al backend ($i/30)..."
            sleep 5
          done
          echo "::error::El backend no respondió a tiempo"
          tail -40 /tmp/overdrive-backend.log
          exit 1

      - name: Smoke test (health + login JWT)
        run: |
          echo "== health =="
          curl -sf http://localhost:4000/api/health
          echo ""
          echo "== login admin =="
          curl -sf -X POST http://localhost:4000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"identifier":"admin@overdrive.app","password":"8H8LrSK8qUhvuY7i6Ghs"}' \
            -o /tmp/login-response.json
          # Verificar que la respuesta es JSON válido antes de procesarla (S8482)
          jq -e . /tmp/login-response.json >/dev/null 2>&1 || { echo "::error::Respuesta de login no es JSON válido"; exit 1; }
          TOKEN=$(jq -r .token /tmp/login-response.json)
          echo "JWT obtenido: ${TOKEN:0:25}..."
          echo "== endpoint protegido con el token =="
          curl -sf http://localhost:4000/api/playlists \
            -H "Authorization: Bearer $TOKEN" >/dev/null && echo "Acceso autorizado OK"

  # ============================================================
  # Job 6: Pruebas de seguridad (OWASP ZAP)
  # Levanta la API (servicio MySQL + Node nativo) y ejecuta un
  # escaneo baseline de ZAP. Publica el reporte como artifact.
  # Usa -I para no fallar por advertencias (solo por fallos).
  # ============================================================
  zap-scan:
    name: Seguridad OWASP ZAP
    runs-on: ubuntu-latest
    needs: [backend-tests]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "2010"
          MYSQL_DATABASE: overdrive
          MYSQL_USER: overdrive_user
          MYSQL_PASSWORD: "2010"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -p2010"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      PORT: 4000
      NODE_ENV: production
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: overdrive_user
      DB_PASSWORD: "2010"
      DB_NAME: overdrive
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_zap_secret' }}
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: |
          for i in 1 2 3 4; do
            npm ci --ignore-scripts && break
            [ $i -eq 4 ] && echo "npm ci falló" && exit 1
            echo "npm ci falló (intento $i); reintentando..."
            sleep 10
          done

      - name: Preparar reportes e inicializar la BD
        working-directory: backend
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zap-reports"
          npm run db:init

      - name: Arrancar el backend
        working-directory: backend
        run: |
          setsid nohup node server.js > /tmp/overdrive-backend.log 2>&1 < /dev/null &
          disown

      - name: Esperar a que el backend esté saludable
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health >/dev/null; then
              echo "Backend saludable :)"
              exit 0
            fi
            echo "Esperando al backend ($i/30)..."
            sleep 5
          done
          echo "::error::El backend no respondió a tiempo"
          tail -40 /tmp/overdrive-backend.log
          exit 1

      - name: Escaneo OWASP ZAP (baseline)
        run: |
          # El contenedor ZAP corre como usuario 'zap' (uid 1000); se asigna
          # la propiedad del directorio a ese uid sin conceder escritura global.
          sudo chown 1000:1000 zap-reports
          chmod 755 zap-reports
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:4000/api/health \
            -r zap-report.html -J zap-report.json -I

      - name: Publicar reporte de ZAP
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zap-report
          path: zap-reports/